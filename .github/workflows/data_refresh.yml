name: Daily Knowledge Base Refresh

on:
  schedule:
    # Runs at 10:00 AM IST (04:30 AM UTC) every day
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  ingest-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential for pushing updated index back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Phase 1 Ingestion Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }} # Optional but recommended for Hub access
        run: |
          python run_phase1.py

      - name: Commit and Push Updated Vector Index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/phase1_ingestion/data/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update knowledge base: $(date +'%Y-%m-%d')"
          git push
