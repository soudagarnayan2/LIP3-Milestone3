services:
  - type: web
    name: sbi-mf-faq-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
        placeholder: "Get your key from https://console.groq.com/keys"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000"
        placeholder: "Comma-separated list of your Vercel frontend URL(s)"
